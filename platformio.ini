[platformio]
src_dir = main

[env:esp32-s3-n8r2]
platform = espressif32@6.13.0
platform_packages =
    platformio/framework-espidf @ 3.50500.0
    platformio/toolchain-xtensa-esp-elf @ 14.2.0+20241119
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_build.esp-idf.sdkconfig_path = sdkconfig
upload_speed = 921600
monitor_speed = 115200
